name: Bug report
description: Report a problem with MedVai PDF Suite
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue. Do not upload confidential, medical, or private documents.

  - type: input
    id: version
    attributes:
      label: Version
      description: Example: v1.0.0-beta.1
    validations:
      required: true

  - type: dropdown
    id: operation
    attributes:
      label: Operation
      options:
        - Merge
        - Split
        - Bates numbering
        - Page numbering
        - Merge + Bates
        - Merge + Numbering
        - Merge + Bates + Numbering
        - Preview
        - Audit report
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Explain the problem in simple steps.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the tool
        2. Select...
        3. Click...
        4. The issue appears
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 10 or Windows 11

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I have not attached confidential, medical, or private documents.
          required: true
